<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login - Lost & Found</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #818CF8;
      --primary-dark: #3730A3;
      --white: #FFFFFF;
      --text-main: #1F2937;
      --text-muted: #6B7280;
      --glass-bg: rgba(255, 255, 255, 0.8);
      --glass-border: rgba(255, 255, 255, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #0f172a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated Background */
    .bg-blobs {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      filter: blur(80px);
    }

    .blob {
      position: absolute;
      width: 400px;
      height: 400px;
      background: var(--primary);
      border-radius: 50%;
      opacity: 0.5;
      animation: move 20s infinite alternate;
    }

    .blob-1 { top: -100px; left: -100px; background: #4F46E5; }
    .blob-2 { bottom: -100px; right: -100px; background: #7C3AED; animation-delay: -5s; }
    .blob-3 { top: 40%; left: 60%; background: #2563EB; animation-delay: -10s; }

    @keyframes move {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(100px, 100px) scale(1.2); }
    }

    .auth-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      padding: 48px;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), #7C3AED);
      color: white;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px;
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
    }

    .auth-header h2 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }

    .auth-header p {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      transition: color 0.3s;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.3s;
      outline: none;
    }

    .form-group input:focus {
      background: white;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .form-group input:focus + i {
      color: var(--primary);
    }

    .forgot-pass {
      text-align: right;
      margin-bottom: 24px;
    }

    .forgot-pass a {
      font-size: 14px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), #7C3AED);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      margin: 24px 0;
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(0, 0, 0, 0.1);
    }

    .social-auth {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .social-btn:hover {
      background: #F9FAFB;
      border-color: rgba(0, 0, 0, 0.1);
    }

    .footer-text {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .msg {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="auth-card">
  <div class="auth-header">
    <div class="logo-icon"><i class="fa-solid fa-cube"></i></div>
    <h2>Welcome Back</h2>
    <p>Sign in to your account to continue</p>
  </div>

  <div class="form-group">
    <i class="fa-solid fa-envelope"></i>
    <input type="email" id="email" placeholder="Email Address">
  </div>
  <div class="form-group">
    <i class="fa-solid fa-lock"></i>
    <input type="password" id="password" placeholder="Password">
  </div>

  <div class="forgot-pass">
    <a href="#" onclick="forgotPassword()">Forgot password?</a>
  </div>

  <button id="loginBtn" onclick="login()">
    <span>Sign In</span>
    <i class="fa-solid fa-arrow-right"></i>
  </button>

  <div class="divider">or continue with</div>

  <div class="social-auth">
    <div class="social-btn" title="Sign in with Google"><i class="fa-brands fa-google" style="color: #DB4437;"></i></div>
    <div class="social-btn" title="Sign in with Apple"><i class="fa-brands fa-apple"></i></div>
    <div class="social-btn" title="Sign in with GitHub"><i class="fa-brands fa-github"></i></div>
  </div>

  <div class="msg" id="message"></div>

  <p class="footer-text">
    Don't have an account? <a href="signup.html">Create one</a>
  </p>

  <div style="margin-top: 24px; text-align: center;">
    <a href="index.html" style="font-size: 13px; color: var(--text-muted); text-decoration: none;">
      <i class="fa-solid fa-chevron-left" style="font-size: 10px; margin-right: 4px;"></i> Back to Dashboard
    </a>
  </div>
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkDU-dLyp66DTmMIpNqBneq9ughfgaCVM",
  authDomain: "lost-found-app-af4e7.firebaseapp.com",
  projectId: "lost-found-app-af4e7",
  storageBucket: "lost-found-app-af4e7.firebasestorage.app",
  messagingSenderId: "933752134956",
  appId: "1:933752134956:web:6edf4c9b1b23c746446089"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.login = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msg = document.getElementById("message");
  const btn = document.getElementById("loginBtn");
  
  if(!email || !password) {
      msg.style.color = "red";
      msg.innerHTML = "Please enter email and password.";
      return;
  }

  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...`;

  try{
    const userCredential = await signInWithEmailAndPassword(auth,email,password);

    if(!userCredential.user.emailVerified){
      msg.style.color="red";
      msg.innerHTML="Please verify your email first!";
      btn.disabled = false;
      btn.innerHTML = `Login <i class="fa-solid fa-right-to-bracket"></i>`;
      return;
    }

    // Fetch user details and assign role
    const userDoc = await getDoc(doc(db, "users", userCredential.user.uid));
    const MASTER_ADMIN_EMAIL = "raviranjan706187@gmail.com";
    const normalizedEmail = userCredential.user.email.toLowerCase().trim();
    const isAdmin = normalizedEmail === MASTER_ADMIN_EMAIL;
    const role = isAdmin ? "admin" : "user";

    if (userDoc.exists()) {
        localStorage.setItem("userName", userDoc.data().name);
        localStorage.setItem("userEmail", userCredential.user.email);
        localStorage.setItem("userId", userCredential.user.uid);
        localStorage.setItem("userRole", role);
    } else {
        localStorage.setItem("userName", "User");
        localStorage.setItem("userEmail", userCredential.user.email);
        localStorage.setItem("userId", userCredential.user.uid);
        localStorage.setItem("userRole", role);
    }

    msg.style.color="green";
    msg.innerHTML="Login Successful!";
    setTimeout(()=>{ window.location.href="index.html"; },1000);

  }catch(error){
    btn.disabled = false;
    btn.innerHTML = `Login <i class="fa-solid fa-right-to-bracket"></i>`;
    msg.style.color="red";
    msg.innerHTML=error.message;
  }
}

window.forgotPassword = async function() {
  const email = document.getElementById("email").value;
  const msg = document.getElementById("message");
  const btn = document.getElementById("loginBtn");
  
  if(!email) {
      msg.style.color = "red";
      msg.innerHTML = "Please enter your email to reset password.";
      return;
  }

  try {
      await sendPasswordResetEmail(auth, email);
      msg.style.color = "green";
      msg.innerHTML = "Password reset email sent! Check your inbox.";
  } catch (error) {
      msg.style.color = "red";
      msg.innerHTML = error.message;
  }
}
</script>

</body>
</html>
